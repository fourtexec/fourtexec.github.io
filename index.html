`,"projects/argus.md":`# argus

> uptime monitoring that assumes you have better things to do.

**argus** is a self-hosted uptime radar. it pings your fleet, watches
your certs and ports, and pages you *only* when it's actually your
fault — after retries, cross-checks from two regions, and a quick
vibe assessment of your last deploy.

## what makes it different

most monitors cry wolf. argus has **opinions**:

- flapping service? it waits, retries from another region, *then* pages
- alert storm? it collapses 400 alerts into one incident with a summary
- 3am page? includes the probable cause, not just «down»

## stack

written in **typescript** on bun, sqlite for storage, one docker
container for the whole thing. dashboard is server-rendered and fast
enough to open during an actual incident.

\`\`\`bash
docker run -d -p 8462:8462 \\
  -v argus-data:/data \\
  fourtexec/argus:latest
\`\`\`

## config taste

\`\`\`yaml
targets:
  - name: api.prod
    url: https://api.fourtexec.dev/health
    expect: { status: 200, latency_under: 250ms }
    page: [telegram, webhook]
\`\`\`

- [x] http / tcp / ping / cert expiry
- [x] telegram, webhook, email, ntfy channels
- [x] public status pages
- [ ] distributed probe agents (in progress)

## fine print

built because our 3am pages used to say «something is wrong maybe».
now they say what broke, when, and whose deploy did it. progress.

MIT. Status: **active** — it watches this very site.
`,"projects/voidloop.md":`# voidloop

> if you did it twice, it's already a pipeline.

**voidloop** is a headless automation daemon. you describe repetitive
work as declarative yaml, voidloop runs it forever — watching files,
webhooks, cron schedules and queues, then clicking the buttons so you
never have to.

## the pitch

zapier charges you per task. cron doesn't retry. github actions wants
your whole life in \`.github/workflows\`. voidloop is one daemon, one
config file, and a policy of *brutal simplicity*.

\`\`\`yaml
- name: mirror-releases
  on: { webhook: github.release }
  run:
    - shell: ./sign-artifacts.sh {{ tag }}
    - http: POST https://irc.fourtexec.dev/broadcast
  retry: { attempts: 5, backoff: exponential }
\`\`\`

## internals

- **go** single binary, ~8mb, embeds its own scheduler
- hot-reloads config on \`SIGHUP\` — zero downtime edits
- every run is journaled to sqlite; \`voidloop log\` is a time machine
- sandboxes shell steps with bubblewrap when available

## status: beta

it runs our infra, so it *works* — but the plugin api is still moving.
pin your version or enjoy the drift.

- [x] webhooks, cron, file watchers
- [x] sqlite journal + tui explorer
- [ ] cluster mode (leader election, etc.)
- [ ] a logo that isn't just a black square

## get it

\`\`\`bash
go install fourtexec.dev/voidloop@latest
voidloop init   # writes a starter pipeline
voidloop up     # daemon mode
\`\`\`

MIT licensed. Contributions welcome — especially cursed integrations.
`,"projects/warpfetch.md":`# warpfetch

> neofetch got slow, so we wrote its obituary in rust.

**warpfetch** is a system information fetch tool in ~400 lines of rust.
zero config, zero dependencies, one static binary. it prints your os,
kernel, shell, cpu, memory and uptime before your terminal finishes
drawing the prompt.

## why it exists

we benchmarked every fetch tool we could find. the fastest one still
spent \`38ms\` *thinking about* your hostname. warpfetch does the whole
job in under **1.2ms** — which is not a feature, it's a refusal to
waste your frames.

## feature dump

- single static binary, ~90kb stripped
- auto-detects 40+ distros, *all* package managers
- ascii art rendered as compile-time string tables, not files
- themeable via one env var: \`WARPFETCH_ACCENT=orange\`
- \`--json\` mode for piping into waybar / tmux / your dashboard

## install

\`\`\`bash
cargo install warpfetch
# or the chaotic way:
curl -fsSL https://fourtexec.dev/warpfetch.sh | sh
\`\`\`

## usage

\`\`\`bash
warpfetch              # pretty output
warpfetch --json       # machine food
warpfetch --bare       # no art, just facts
\`\`\`

## the numbers

| tool       | cold start | binary size |
|------------|-----------|-------------|
| warpfetch  | 1.2 ms    | 90 kb       |
| neofetch   | 97 ms     | 120 kb*     |

*and 10,000 lines of bash. we counted. we regret counting.

## contrib

- [x] linux, macos, freebsd
- [x] waybar / tmux modules
- [ ] windows (accepting pain-tolerant volunteers)
