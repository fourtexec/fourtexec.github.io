# name        title of the project
# description one or two sentences
# link        the repository
# site        the project's own website, if it has one
# readme      markdown file with the full description, shown on the project page
# tags        a few words shown under the description
# status      active, beta, archived or any other word
projects:
  - name: Mesh Ranker
    description: An Android app for МЭШ with the schedule, homework, grades and student rankings.
    link: https://github.com/fourtexec/mesh-ranker-app
    readme: projects/mesh-ranker.md
    tags: [android, kotlin, jetpack compose]
    status: active
  - name: Uxaoro
    description: Uxaoro is ready, beta testing
    link: https://github.com/fourtexec/uxaoro
    site: https://uxaoro.fourtexec.site/
    readme: projects/argus.md
    tags: [social network, android, pc, web]
    status: beta test
  - name: NewTeller
    description: A Wayland desktop for Linux with its own compositor, panel and settings.
    link: https://github.com/fourtexec/newteller
    site: https://fourtexec.site/newteller/
    readme: projects/newteller.md
    tags: [linux, wayland, desktop, qt]
    status: beta
  - name: nash
    description: An sh-compatible shell written in Rust, with ideas taken from bash and zsh.
    link: https://github.com/fourtexec/nash
    readme: projects/nash.md         # generated from the releases of fourtexec/nash
    tags: [shell, rust, linux, macos, android]
    status: active

join:
  title: Join us
  intro: >
    We are a small team and sometimes take new people. If you would
    like to work with us, this is how it goes.
  steps:
    - Make something of your own. A program, a bot, an app, anything you can show.
    - Put it somewhere public. A GitHub repository is best.
    - Email us the link and a few words about yourself.
    - If it looks like a fit we will write back and set up a call.
  email: join@fourtexec.site
  subject: Joining fourtexec       # subject of the email the button opens
  note: Please send links, not PDF or Word attachments.

# The sign in button and the announcement banners come from the api.
# If it is down the site is shown without them.
# On localhost these point at local dev servers.
accounts:
  enabled: true
  api: https://api.fourtexec.site        # fourtexec/api
  url: https://accounts.fourtexec.site   # fourtexec/accounts

footer:
  note: ""                         # extra text after the copyright
  copyright: "2026"                # "" uses the current year
