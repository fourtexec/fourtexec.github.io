# Settings and text for fourtexec.site.
# logo.png is the logo for the light theme, dlogo.png for the dark one.

site:
  name: fourtexec
  domain: fourtexec.site
  tagline: We make open-source software
  description: >
    fourtexec is a small team. We write software and publish the
    source on GitHub. Our projects are listed below.
  email: join@fourtexec.site

# platform is one of: github, telegram, youtube, x, discord, twitch,
# instagram, linkedin, mail, rss, web. label is optional.
socials:
