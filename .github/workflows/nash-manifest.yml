name: nash release manifest

# Keeps what the site says about nash in step with the releases of
# fourtexec/nash:
#   nash/manifest.json  (https://fourtexec.site/nash/manifest.json) the
#                       releases and their binaries as data
#   projects/nash.md    the project page: newest releases, downloads, changes
#
# The release workflow of fourtexec/nash runs the same generator and pushes
# here after every release (it needs the SITE_TOKEN secret there). This
# workflow is the safety net: it runs twice an hour and needs no secret.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [ghpages]
    paths:
      - .github/scripts/nash-manifest.py
      - .github/scripts/test_nash_manifest.py
      - .github/workflows/nash-manifest.yml

permissions:
  contents: write

concurrency:
  group: nash-manifest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ghpages
      - name: Check the generator
        run: python3 .github/scripts/test_nash_manifest.py
      - name: Regenerate the manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p nash
          python3 .github/scripts/nash-manifest.py nash/manifest.json projects/nash.md
      - name: Publish
        run: |
          python3 -c 'import json; json.load(open("nash/manifest.json"))'
          git add nash/manifest.json projects/nash.md
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'nash release manifest'
          # Other workflows commit to the same branch.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
