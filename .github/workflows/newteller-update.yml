name: NewTeller update data

# Keeps newteller/update.json (https://fourtexec.site/newteller/update.json)
# pointing at the newest NewTeller builds. NewTeller's updater reads that
# file and downloads the build from the link in it.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [ghpages]
    paths:
      - .github/scripts/newteller-update.py
      - .github/workflows/newteller-update.yml

permissions:
  contents: write

concurrency:
  group: newteller-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate the update data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/newteller-update.py newteller/update.json
      - name: Publish
        run: |
          python3 -c 'import json; json.load(open("newteller/update.json"))'
          if git diff --quiet -- newteller/update.json && git ls-files --error-unmatch newteller/update.json > /dev/null 2>&1; then
            echo 'Nothing changed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add newteller/update.json
          git commit -m 'NewTeller update data'
          git push
